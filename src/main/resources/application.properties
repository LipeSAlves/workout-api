spring.application.name=workout-api
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:h2:mem:workoutdb
spring.datasource.driverClassaName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:this-is-a-development-secret-key-with-at-least-256-bits-required-for-hs256-algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}
